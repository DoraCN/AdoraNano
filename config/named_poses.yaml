# Named joint configurations for ADORA NANO - generated by gen_urdf.py
# `joints` values are radians (revolute/continuous) / metres (prismatic).
# `fk` is the world pose of the named frames at that configuration, computed
# with the SAME joint origins/axes as the URDF (base_link == identity at home),
# so a loader can assert its FK against these numbers.
robot: adora_nano
frames: [left_tool_mount, right_tool_mount, head_tilt, left_wrist_cam, right_wrist_cam]
# left/right_tool_mount = TCP / grasp-proxy frames (the soft gripper is a
# rigid body on the wrist_housing; there is no j6/gripper DOF).
# World reference: base_link is at CAD (0,0,0); the CAD ground plane is
# GROUND_Z below it and the 3 driven wheels (R = axle_z + |GROUND_Z|) touch it.
world_reference:
  ground_z_m: -0.0343
  wheel_radius_m: 0.05101
  wheel_axle_z_m: [0.01671]
  wheel_joints: [wheel_1_joint, wheel_2_joint, wheel_3_joint]
named_poses:
  home:
    description: "CAD zero pose (all joints at 0). This is the pose the URDF is authored in and the one that reproduces spec.links[].frame_base_m."
    joints: {}
    fk:
      left_tool_mount: [0.264299982206, 0.217470023715, 0.373524981442]
      right_tool_mount: [0.264299982206, -0.242529976285, 0.373524981442]
      head_tilt: [0.0875, 0, 0.4011]
      left_wrist_cam: [0.234597186704, 0.246481215349, 0.436709934425]
      right_wrist_cam: [0.234707786706, -0.213555010569, 0.436708618208]
  ready:
    description: "Grasp-ready: both arms reaching forward and slightly down in front of the chassis, head looking forward/down."
    joints:
      left_j1_yaw: -0.2
      left_j2_pitch: 0.4
      left_j3_pitch: 0.6
      left_j4_pitch: 0.2
      left_j5_roll: 0
      right_j1_yaw: 0.2
      right_j2_pitch: 0.4
      right_j3_pitch: 0.6
      right_j4_pitch: 0.2
      right_j5_roll: 0
      head_pan_joint: 0
      head_tilt_joint: -0.15
    fk:
      left_tool_mount: [0.163994943278, 0.227937511413, 0.207135948794]
      right_tool_mount: [0.159016297099, -0.252497938622, 0.207135947831]
      head_tilt: [0.0875, 0, 0.4011]
      left_wrist_cam: [0.205399761817, 0.265931934522, 0.257715671988]
      right_wrist_cam: [0.211979265192, -0.233669775676, 0.257612109714]
  stow:
    description: "Transport: arms folded back beside the chassis (elbows bent, tips behind and level with the base), head tucked down."
    joints:
      left_j1_yaw: 0
      left_j2_pitch: -1.05
      left_j3_pitch: -2.45
      left_j4_pitch: 0
      left_j5_roll: 0
      right_j1_yaw: 0
      right_j2_pitch: -1.05
      right_j3_pitch: -2.45
      right_j4_pitch: 0
      right_j5_roll: 0
      head_pan_joint: 0
      head_tilt_joint: 1.1
    fk:
      left_tool_mount: [-0.169594923967, 0.21747000219, 0.150557654699]
      right_tool_mount: [-0.169594923967, -0.24252999781, 0.150557654699]
      head_tilt: [0.0875, 0, 0.4011]
      left_wrist_cam: [-0.119615324318, 0.246481200877, 0.101806925948]
      right_wrist_cam: [-0.119719358132, -0.213555025054, 0.101769361902]
